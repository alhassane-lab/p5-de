version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27018:27017"
    volumes:
      - ./mongo-data:/data/db

  app:
    build: .
    container_name: mongo-mig
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017
    command: poetry run python -m src.main